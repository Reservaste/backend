name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # supabase start applies every migration under supabase/migrations/
      # from scratch -- this is the same check as `npx supabase db reset`,
      # so a migration that only "worked" against a hand-patched local DB
      # fails here instead of at the first real deploy.
      - run: npx supabase start
      - run: npm run test:integration
      - if: always()
        run: npx supabase stop
