name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase start` pulls ~15 Supabase images from ghcr.io. Unauthenticated
      # (the default), those pulls count against ghcr.io's shared anonymous
      # rate limit, pooled across every GitHub Actions runner on the range --
      # not just this repo's traffic -- which is what was tripping
      # `toomanyrequests` here repeatedly on 2026-09-23 even on a lone rerun.
      # GITHUB_TOKEN already carries public-package read access; logging in
      # with it moves these pulls to the much higher per-token quota.
      - name: Log in to GHCR (avoids the shared anonymous pull rate limit)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # supabase start applies every migration under supabase/migrations/
      # from scratch -- this is the same check as `npx supabase db reset`,
      # so a migration that only "worked" against a hand-patched local DB
      # fails here instead of at the first real deploy.
      - run: npx supabase start
      - run: npm run test:integration
      - if: always()
        run: npx supabase stop

  # Applies pending migrations to the real production database. Gated
  # behind the `production` GitHub Environment, which the repo settings
  # configure with a required reviewer -- this job blocks and waits for a
  # human to click Approve before a single statement runs, no exception.
  # Not because CI can't be trusted, but because the first migration this
  # project pushed against real data (Phase 22, 2026-09-22) failed on its
  # first attempt against production rows no local test had ever
  # exercised -- a schema change on real payments and credits gets a human
  # look before it runs, every time.
  deploy-migrations:
    needs: [typecheck-and-unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A second, independent safety net alongside the droplet's own
      # nightly backup.sh: this one is taken at the exact moment before
      # THIS migration runs, travels with the workflow run that applied
      # it, and doesn't depend on the droplet existing at all.
      #
      # Plain `postgresql-client` pulls whatever version ubuntu-latest's
      # default repos ship (16), and pg_dump refuses to dump a NEWER
      # server than itself as a safety check -- production is Postgres
      # 17. The PGDG repo is what actually carries postgresql-client-17.
      - name: Install postgresql-client 17 (for pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      # `set -o pipefail`, not the default: without it, this step reported
      # success once already (2026-09-22) while pg_dump itself had failed
      # with no connection at all -- gzip happily compressed empty stdin
      # into a valid-looking .gz, and being the last command in the pipe,
      # its own exit code was the only one that mattered. A backup step
      # that lies about having a backup is worse than one that fails
      # loudly with nothing.
      #
      # PROD_DB_URL goes through env:, not inline `${{ }}` text in the
      # script: GitHub substitutes an inline secret as literal text before
      # bash ever parses the line, so a password containing a quote or
      # backtick could break the command -- or worse. An env var is passed
      # through the process environment instead, immune to that.
      - name: Backup production before migrating
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -o pipefail
          if [ -z "$PROD_DB_URL" ]; then
            echo "::error::PROD_DB_URL is not set on this repository -- add it under Settings > Secrets and variables > Actions before this can run."
            exit 1
          fi
          # ubuntu-latest ships postgresql-client 16 pre-installed and
          # owning the plain `pg_dump` on PATH -- installing -17 alongside
          # it did not make it win (confirmed: still resolved to 16.15
          # after that install, 2026-09-22). Calling the versioned binary
          # directly sidesteps whatever the alternatives system decides.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version
          "$PG_DUMP" "$PROD_DB_URL" --schema=public --no-owner --no-privileges \
            | gzip > pre-migration-backup.sql.gz

      - name: Upload backup as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-migration-backup-${{ github.sha }}
          path: pre-migration-backup.sql.gz
          retention-days: 90

      - name: Apply pending migrations to production
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: npx supabase db push --db-url "$PROD_DB_URL"
